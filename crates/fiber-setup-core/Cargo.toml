[package]
name = "fiber-setup-core"
description = "Flashes a HARDWARIO FIBER (CM4) over its USB-B port: image, rpiboot, eMMC write, first-boot settings"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
fatfs = "0.3"
getrandom = "0.3"
hex = "0.4"
liblzma = { version = "0.4", features = ["static"] }
sha-crypt = "0.5"
sha2 = "0.10"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
nusb = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1", default-features = false }
rustix = { version = "1", features = ["fs", "net"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
