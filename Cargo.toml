[workspace]
resolver = "3"
members = ["crates/fiber-setup-core", "crates/fiber-setup-cli", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["HARDWARIO a.s. <ask@hardwario.com>"]
repository = "https://github.com/hardwario/fiber-setup"
rust-version = "1.99"

[workspace.dependencies]
fiber-setup-core = { path = "crates/fiber-setup-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
