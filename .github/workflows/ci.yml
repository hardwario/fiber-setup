name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything in the README's "Checks", on the three systems the app runs on: the code that
  # finds and writes a FIBER is a different one on each.
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/check-version.mjs
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The app's build takes the gadget's files from here (on Windows the USB driver too).
      - run: npm run usbboot
      - name: The USB driver's catalog
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/driver-catalog.ps1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # What only Windows can show: Windows takes the USB driver, the installer installs and
      # uninstalls.
      - name: The Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/windows-test.ps1
