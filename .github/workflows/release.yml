name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: everything is built and checked, nothing is published.
  workflow_dispatch:

# Read-only by default; only the final job writes the release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The tag must match every version (a dry run checks only that they agree).
      - run: node scripts/check-version.mjs
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # No rust-cache in releases: a tag cannot read another tag's caches, so
      # it would never hit, and each release would only upload gigabytes.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The gadget's files (on Windows the USB driver too).
      - run: npm run usbboot
      - name: The USB driver's catalog
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/driver-catalog.ps1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # What only Windows can show: Windows takes the USB driver, the installer installs and
      # uninstalls.
      - name: The Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/windows-test.ps1

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app only, for Apple silicon and Intel in one: sign-macos signs
          # it and makes the dmg.
          - name: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app
          - name: linux
            os: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage,deb
          # The exe only: sign-windows signs it and makes the installer and the zip.
          - name: windows
            os: windows-latest
            rust-targets: ""
            args: --no-bundle
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libfuse2
      # No signing secrets in this job: it runs every dependency's build
      # script. The macOS app comes out ad-hoc signed and the Windows exe
      # unsigned; the sign jobs sign them.
      - name: The gadget's files
        run: npm run usbboot
      - name: The USB driver's catalog
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/driver-catalog.ps1
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: npx tauri build ${{ matrix.args }} -- --locked
      # The command line, released beside the app. On macOS for Apple silicon and Intel in one
      # program, as the app is. On Windows with the C runtime inside the program (the app gets
      # its VC runtime that way from tauri-build), so that it also starts on a Windows without
      # the Visual C++ runtime; with --target, the flag reaches only the program, not the build
      # scripts.
      - name: Build the command line
        env:
          NAME: ${{ matrix.name }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          case "$NAME" in
            macos)
              cargo build --release --locked -p fiber-setup-cli --target aarch64-apple-darwin --target x86_64-apple-darwin
              mkdir -p target/cli
              lipo -create -output target/cli/fiber-setup-cli \
                target/aarch64-apple-darwin/release/fiber-setup-cli target/x86_64-apple-darwin/release/fiber-setup-cli ;;
            linux)
              cargo build --release --locked -p fiber-setup-cli ;;
            windows)
              RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked -p fiber-setup-cli --target x86_64-pc-windows-msvc ;;
          esac
      # The app and the command line must start on a Windows without the Visual
      # C++ runtime. tauri-build links the app's VC runtime statically and the
      # Universal CRT dynamically; the UCRT is part of every Windows 10 and 11,
      # so only the VC runtime DLLs fail the check.
      - name: Check that the programs need no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found"; exit 1 }
          foreach ($exe in 'target\release\fiber-setup.exe', 'target\x86_64-pc-windows-msvc\release\fiber-setup-cli.exe') {
            $deps = & $dumpbin.FullName /nologo /dependents $exe
            $deps
            $crt = $deps -match 'vcruntime|msvcp'
            if ($crt) { Write-Error "$exe depends on the Visual C++ runtime: $crt"; exit 1 }
          }
      # What the installer and the zips are made from (the command line too),
      # and Microsoft's WebView2 installer that the app's installer carries.
      - name: Stage the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/windows-package.ps1 -Step stage -Exe target\release\fiber-setup.exe -Cli target\x86_64-pc-windows-msvc\release\fiber-setup-cli.exe -Work out
          scripts/windows-package.ps1 -Step webview2 -Work out
      - name: Collect artifacts
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          v="${v//\//-}"  # a dry run on feature/x
          mkdir -p out
          # The command line's folder: the program, the gadget's files beside it (it finds them
          # there) and the licences.
          cli="stage/fiber-setup-cli-$v"
          if [ "$NAME" != windows ]; then
            mkdir -p "$cli"
            cp -R src-tauri/resources/usbboot "$cli/usbboot"
            cp -R LICENSE LICENSES "$cli/"
          fi
          case "$NAME" in
            # Signed, notarized, put in a dmg and checksummed by sign-macos.
            # ditto keeps what a plain artifact loses: file modes (the app's
            # program must stay executable) and links.
            # The command line the same way, its program signed by sign-macos too.
            macos) ditto -c -k --keepParent "target/universal-apple-darwin/release/bundle/macos/FIBER Setup.app" out/fiber-setup-app.zip
                   cp target/cli/fiber-setup-cli "$cli/"
                   ditto -c -k --keepParent "$cli" out/fiber-setup-cli.zip ;;
            linux) cp target/release/bundle/appimage/*.AppImage "out/fiber-setup-$v-linux-x86_64.AppImage"
                   cp target/release/bundle/deb/*.deb "out/fiber-setup-$v-linux-x86_64.deb"
                   cp target/release/fiber-setup-cli "$cli/"
                   tar -C stage -czf "out/fiber-setup-cli-$v-linux-x86_64.tar.gz" "fiber-setup-cli-$v" ;;
            # Staged above: out/app, out/cli and Microsoft's WebView2 installer.
            # Signed, packed and checksummed by sign-windows.
            windows) ;;
          esac
          cd out
          if [ "$NAME" = linux ]; then
            for f in fiber-setup-*; do sha256sum "$f" > "$f.sha256"; done
          fi
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name == 'linux' && 'linux' || format('unsigned-{0}', matrix.name) }}
          path: out/*

  # Authenticode signing of the Windows binaries with Azure Artifact Signing,
  # and the installer and the zip made from them (docs/release.md). A job of
  # its own, so only these steps can get the OIDC token, in the `signing`
  # environment, which admits only release tags. Nothing is compiled here:
  # it signs, and packs with NSIS.
  sign-windows:
    name: Sign (Windows)
    needs: [build]
    # A pushed release tag, or a dry run started on one; branch dry runs stay
    # unsigned and are never published.
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    environment: signing
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # For the packaging scripts, the installer's script and the icon.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows
          path: work
      # Before the first signing, so that it is signed with the rest: the
      # installer carries it, and cannot be changed once it is made.
      - name: The uninstaller
        shell: pwsh
        run: scripts/windows-package.ps1 -Step uninstaller -Work work
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Ours only: the app, the command line, the USB driver's catalog and the
      # uninstaller. Not Microsoft's WebView2 installer: that is signed by
      # Microsoft.
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: hardwario
          certificate-profile-name: hardwario
          files: |
            ${{ github.workspace }}\work\app\fiber-setup.exe
            ${{ github.workspace }}\work\cli\fiber-setup-cli.exe
            ${{ github.workspace }}\work\app\usbboot\driver\fiber-usbboot.cat
            ${{ github.workspace }}\work\uninstall.exe
          file-digest: SHA256
          # The certificates live about three days; only the timestamp keeps
          # a signature valid after that.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: FIBER Setup
          description-url: https://github.com/hardwario/fiber-setup
          # Its tools fresh from their sources: a cached copy could have been
          # saved by a build job (whose npm and Cargo build scripts run) and
          # would then run here, with the signing login active.
          cache-dependencies: false
          # The Azure CLI login above; the other credential types would only
          # be tried and fail first.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify the signatures
        shell: pwsh
        run: scripts/windows-verify.ps1 -Work work -Files app\fiber-setup.exe, cli\fiber-setup-cli.exe, app\usbboot\driver\fiber-usbboot.cat, uninstall.exe
      # The question a signature check cannot answer: does Windows take a
      # driver package signed this way? Its signer is put among this
      # machine's trusted publishers (what "Always trust software from
      # HARDWARIO a.s." does on a user's computer), then the package is added
      # to the driver store. Five minutes: Windows would ask on the screen if
      # it did not trust it, and nobody is there to answer.
      - name: Windows takes the signed driver
        shell: pwsh
        timeout-minutes: 5
        run: scripts/windows-verify.ps1 -Work work -Driver
      - name: The installer and the zips
        shell: pwsh
        run: |
          $label = "$env:GITHUB_REF_NAME" -replace '^v', ''
          scripts/windows-package.ps1 -Step installer -Label $label -Work work
          scripts/windows-package.ps1 -Step zip -Label $label -Work work
          scripts/windows-package.ps1 -Step cli -Label $label -Work work
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: hardwario
          certificate-profile-name: hardwario
          files-folder: ${{ github.workspace }}\work\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: FIBER Setup
          description-url: https://github.com/hardwario/fiber-setup
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify the installer
        shell: pwsh
        run: scripts/windows-verify.ps1 -Work work -Installer
      - name: Checksums
        run: |
          set -euo pipefail
          cd work/out
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: work/out/*

  # Developer ID signing and notarization of the macOS app and its dmg
  # (docs/release.md). A job of its own, in the `signing` environment, which
  # admits only release tags: the certificate and the API key never meet the
  # build scripts.
  sign-macos:
    name: Sign and notarize (macOS)
    needs: [build]
    # A pushed release tag, or a dry run started on one; branch dry runs stay
    # unsigned and are never published.
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    environment: signing
    permissions:
      contents: read
    env:
      APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-macos
          path: unsigned/unsigned-macos
      - name: Import the certificate and the API key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # In front of the existing keychains (xargs undoes their quotes).
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; fi
          echo "Signing as $identity"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          { echo "IDENTITY=$identity"; echo "KEYCHAIN=$keychain"; } >> "$GITHUB_ENV"
      - name: Sign, notarize and staple
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          sign() { codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$@"; }
          # Waits for Apple's verdict; anything but Accepted prints the log and fails.
          notarize() {
            local result id status
            result=$(xcrun notarytool submit "$1" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json)
            id=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])' <<< "$result")
            status=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])' <<< "$result")
            echo "$(basename "$1"): $status ($id)"
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
              exit 1
            fi
          }
          mkdir -p work out
          ditto -x -k unsigned/unsigned-macos/fiber-setup-app.zip work
          app="work/FIBER Setup.app"
          # Apple refuses an app with any program in it that is not signed, so
          # the only program in it must be the app's own, signed below.
          programs=$(cd "$app" && find . -type f -exec sh -c 'file -b "$1" | grep -q "Mach-O" && echo "${1#./}"' _ {} \; | sort)
          echo "$programs"
          if [ "$programs" != Contents/MacOS/fiber-setup ]; then echo "::error::the app holds another program than the one this job signs"; exit 1; fi
          sign "$app"
          codesign --verify --strict --verbose=2 "$app"
          # The app, stapled so that it opens offline too.
          ditto -c -k --keepParent "$app" work/app.zip
          notarize work/app.zip
          xcrun stapler staple "$app"
          # The dmg: the app and a link to Applications.
          mkdir work/dmg
          ditto "$app" "work/dmg/FIBER Setup.app"
          ln -s /Applications work/dmg/Applications
          dmg="out/fiber-setup-$v-macos-universal.dmg"
          hdiutil create -volname "FIBER Setup" -srcfolder work/dmg -fs HFS+ -format UDZO -ov "$dmg"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          # The command line: its program signed, and the zip notarized. A bare program cannot
          # carry a stapled ticket; Gatekeeper asks Apple for it when the program first runs.
          ditto -x -k unsigned/unsigned-macos/fiber-setup-cli.zip work/cli
          cli="work/cli/fiber-setup-cli-$v"
          programs=$(cd "$cli" && find . -type f -exec sh -c 'file -b "$1" | grep -q "Mach-O" && echo "${1#./}"' _ {} \; | sort)
          echo "$programs"
          if [ "$programs" != fiber-setup-cli ]; then echo "::error::the command line's folder holds another program than the one this job signs"; exit 1; fi
          sign --identifier com.hardwario.fiber-setup-cli "$cli/fiber-setup-cli"
          codesign --verify --strict --verbose=2 "$cli/fiber-setup-cli"
          zip="out/fiber-setup-cli-$v-macos-universal.zip"
          ditto -c -k --keepParent "$cli" "$zip"
          notarize "$zip"
      - name: Verify
        run: |
          set -euo pipefail
          app="work/FIBER Setup.app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          dmg=$(echo out/*.dmg)
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          for f in "$app/Contents/MacOS/fiber-setup" work/cli/fiber-setup-cli-*/fiber-setup-cli; do
            info=$(codesign -dvv "$f" 2>&1)
            grep -q "Authority=Developer ID Application" <<< "$info" || { echo "::error::$f is not signed with Developer ID"; exit 1; }
            grep -q "^Timestamp=" <<< "$info" || { echo "::error::the signature of $f has no timestamp"; exit 1; }
            grep -q "flags=0x10000(runtime)" <<< "$info" || { echo "::error::$f lacks the hardened runtime"; exit 1; }
            [ "$(lipo -archs "$f" | tr ' ' '\n' | sort | xargs)" = "arm64 x86_64" ] || { echo "::error::$f is not for Apple silicon and Intel"; exit 1; }
          done
      - name: Checksums
        run: |
          set -euo pipefail
          cd out
          for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la
      - name: Remove the keychain and the API key
        if: always()
        run: |
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*

  # One job creates the draft release, so the builds cannot race to make two.
  publish:
    name: Draft release
    needs: [build, sign-windows, sign-macos]
    # Only a pushed tag: a dry run started on a tag must not replace the
    # assets of its release.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release's artifacts by name: the signed builds and the one that
      # needs no signature, never the unsigned ones the sign jobs started
      # from (or anything else a job may have uploaded).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: artifacts/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: artifacts/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: artifacts/linux
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir out
          problems=0
          for f in artifacts/*/*; do
            name=$(basename "$f")
            # Two artifacts with one file name: neither may silently win.
            if [ -e "out/$name" ]; then echo "::error::$name is in two artifacts"; problems=1; fi
            cp "$f" out/
          done
          ls -la out
          # Every file of a release, each with its checksum, and nothing else.
          cd out
          expected=()
          for f in fiber-setup-*-windows-x64-setup.exe fiber-setup-*-windows-x64-portable.zip \
                   fiber-setup-*-macos-universal.dmg fiber-setup-*-linux-x86_64.AppImage fiber-setup-*-linux-x86_64.deb \
                   fiber-setup-cli-*-windows-x64.zip fiber-setup-cli-*-macos-universal.zip fiber-setup-cli-*-linux-x86_64.tar.gz; do
            if [ ! -f "$f" ] || [ ! -f "$f.sha256" ]; then echo "::error::missing $f or its checksum"; problems=1; fi
            expected+=("$f" "$f.sha256")
          done
          for f in *; do
            if [[ ! " ${expected[*]} " == *" $f "* ]]; then echo "::error::unexpected file $f"; problems=1; fi
          done
          exit $problems
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: out/*
