name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: everything is built and checked, nothing is published.
  workflow_dispatch:

# Read-only by default; only the final job writes the release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The tag must match every version (a dry run checks only that they agree).
      - run: node scripts/check-version.mjs
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libusb-1.0-0-dev patchelf
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # No rust-cache in releases: a tag cannot read another tag's caches, so
      # it would never hit, and each release would only upload gigabytes.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run usbboot
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # No Windows here: FIBER Setup does not run on Windows yet, so there is
  # nothing to build or sign for it (docs/release.md).
  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app only, for Apple silicon and Intel in one: sign-macos signs
          # it and makes the dmg.
          - name: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app
          - name: linux
            os: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libusb-1.0-0-dev patchelf libfuse2
      # No signing secrets in this job: it runs every dependency's build
      # script, and builds rpiboot and libusb from their sources. The macOS
      # app comes out ad-hoc signed; sign-macos signs it.
      - name: rpiboot and the gadget
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: npm run usbboot
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: npx tauri build ${{ matrix.args }} -- --locked
      - name: Collect artifacts
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          v="${v//\//-}"  # a dry run on feature/x
          mkdir -p out
          case "$NAME" in
            # Signed, notarized, put in a dmg and checksummed by sign-macos.
            # ditto keeps what a plain artifact loses: file modes (rpiboot
            # must stay executable) and links.
            macos) ditto -c -k --keepParent "target/universal-apple-darwin/release/bundle/macos/FIBER Setup.app" out/fiber-setup-app.zip ;;
            linux) cp target/release/bundle/appimage/*.AppImage "out/fiber-setup-$v-linux-x86_64.AppImage"
                   cp target/release/bundle/deb/*.deb "out/fiber-setup-$v-linux-x86_64.deb" ;;
          esac
          cd out
          if [ "$NAME" = linux ]; then
            for f in fiber-setup-*; do sha256sum "$f" > "$f.sha256"; done
          fi
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name == 'linux' && 'linux' || format('unsigned-{0}', matrix.name) }}
          path: out/*

  # Developer ID signing and notarization of the macOS app and its dmg
  # (docs/release.md). A job of its own, in the `signing` environment, which
  # admits only release tags: the certificate and the API key never meet the
  # build scripts.
  sign-macos:
    name: Sign and notarize (macOS)
    needs: [build]
    # A pushed release tag, or a dry run started on one; branch dry runs stay
    # unsigned and are never published.
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    environment: signing
    permissions:
      contents: read
    env:
      APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-macos
          path: unsigned/unsigned-macos
      - name: Import the certificate and the API key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # In front of the existing keychains (xargs undoes their quotes).
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; fi
          echo "Signing as $identity"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          { echo "IDENTITY=$identity"; echo "KEYCHAIN=$keychain"; } >> "$GITHUB_ENV"
      - name: Sign, notarize and staple
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          sign() { codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$@"; }
          # Waits for Apple's verdict; anything but Accepted prints the log and fails.
          notarize() {
            local result id status
            result=$(xcrun notarytool submit "$1" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json)
            id=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])' <<< "$result")
            status=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])' <<< "$result")
            echo "$(basename "$1"): $status ($id)"
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
              exit 1
            fi
          }
          mkdir -p work out
          ditto -x -k unsigned/unsigned-macos/fiber-setup-app.zip work
          app="work/FIBER Setup.app"
          usbboot="$app/Contents/Resources/usbboot"
          # Apple refuses an app with any program in it that is not signed, so
          # the programs in it must be exactly the three signed below.
          programs=$(cd "$app" && find . -type f -exec sh -c 'file -b "$1" | grep -q "Mach-O" && echo "${1#./}"' _ {} \; | sort)
          echo "$programs"
          expected=$(printf '%s\n' Contents/MacOS/fiber-setup Contents/Resources/usbboot/libusb-1.0.0.dylib Contents/Resources/usbboot/rpiboot)
          if [ "$programs" != "$expected" ]; then echo "::error::the app does not hold exactly the three programs this job signs"; exit 1; fi
          # Inside out: the library rpiboot loads, rpiboot, then the app, whose
          # signature seals the two (never --deep).
          sign "$usbboot/libusb-1.0.0.dylib"
          sign "$usbboot/rpiboot"
          sign "$app"
          codesign --verify --strict --verbose=2 "$app"
          # The app, stapled so that it opens offline too.
          ditto -c -k --keepParent "$app" work/app.zip
          notarize work/app.zip
          xcrun stapler staple "$app"
          # The dmg: the app and a link to Applications.
          mkdir work/dmg
          ditto "$app" "work/dmg/FIBER Setup.app"
          ln -s /Applications work/dmg/Applications
          dmg="out/fiber-setup-$v-macos-universal.dmg"
          hdiutil create -volname "FIBER Setup" -srcfolder work/dmg -fs HFS+ -format UDZO -ov "$dmg"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
      - name: Verify
        run: |
          set -euo pipefail
          app="work/FIBER Setup.app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          dmg=$(echo out/*.dmg)
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          for f in "$app/Contents/MacOS/fiber-setup" "$app/Contents/Resources/usbboot/rpiboot" "$app/Contents/Resources/usbboot/libusb-1.0.0.dylib"; do
            info=$(codesign -dvv "$f" 2>&1)
            grep -q "Authority=Developer ID Application" <<< "$info" || { echo "::error::$f is not signed with Developer ID"; exit 1; }
            grep -q "^Timestamp=" <<< "$info" || { echo "::error::the signature of $f has no timestamp"; exit 1; }
            grep -q "flags=0x10000(runtime)" <<< "$info" || { echo "::error::$f lacks the hardened runtime"; exit 1; }
            [ "$(lipo -archs "$f" | tr ' ' '\n' | sort | xargs)" = "arm64 x86_64" ] || { echo "::error::$f is not for Apple silicon and Intel"; exit 1; }
          done
          # With the hardened runtime rpiboot loads only a library signed by
          # the same team: it must still start with the libusb next to it.
          "$app/Contents/Resources/usbboot/rpiboot" -h | grep -q "Usage: rpiboot" || { echo "::error::the signed rpiboot does not start"; exit 1; }
      - name: Checksums
        run: |
          set -euo pipefail
          cd out
          for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la
      - name: Remove the keychain and the API key
        if: always()
        run: |
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*

  # One job creates the draft release, so the builds cannot race to make two.
  publish:
    name: Draft release
    needs: [build, sign-macos]
    # Only a pushed tag: a dry run started on a tag must not replace the
    # assets of its release.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release's artifacts by name: the signed build and the one that
      # needs no signature, never the unsigned one sign-macos started from
      # (or anything else a job may have uploaded).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: artifacts/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: artifacts/linux
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir out
          problems=0
          for f in artifacts/*/*; do
            name=$(basename "$f")
            # Two artifacts with one file name: neither may silently win.
            if [ -e "out/$name" ]; then echo "::error::$name is in two artifacts"; problems=1; fi
            cp "$f" out/
          done
          ls -la out
          # Every file of a release, each with its checksum, and nothing else.
          cd out
          expected=()
          for f in fiber-setup-*-macos-universal.dmg fiber-setup-*-linux-x86_64.AppImage fiber-setup-*-linux-x86_64.deb; do
            if [ ! -f "$f" ] || [ ! -f "$f.sha256" ]; then echo "::error::missing $f or its checksum"; problems=1; fi
            expected+=("$f" "$f.sha256")
          done
          for f in *; do
            if [[ ! " ${expected[*]} " == *" $f "* ]]; then echo "::error::unexpected file $f"; problems=1; fi
          done
          exit $problems
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: out/*
